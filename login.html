<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vektora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container" style="display:flex; justify-content:center; align-items:center; min-height:80vh;">
        <div style="max-width:400px; width:100%; background:var(--bg-secondary); padding:3rem; border-radius:var(--radius-md); border:1px solid var(--border-color);">
            <h2 style="text-align:center; margin-bottom:2rem;">VEKTORA LOGIN</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Username (admin)</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password (admin)</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">MASUK KE SISTEM</button>
            </form>
            <div style="text-align:center; margin-top:2rem;">
                <a href="index.html" style="font-size:0.9rem; color:var(--text-secondary);">Kembali ke website</a>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
