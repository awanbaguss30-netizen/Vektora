<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baca Artikel - Vektora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">Vektora</a>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-outline">KEMBALI KE BERANDA</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="article-header">
            <span id="article-category" class="card-category" style="font-size:1rem; font-weight:700;">Kategori</span>
            <h1 id="article-title">Memuat Judul Artikel...</h1>
            <div class="article-meta-large">
                <span id="article-date">Tanggal</span>
                <span id="article-views">0 Views</span>
            </div>
        </div>

        <img id="article-image" src="" alt="Gambar Artikel" class="article-featured-img">

        <div id="article-content-body" class="article-content">
            <!-- Injected via JS -->
            Mempersiapkan isi artikel...
        </div>

        <div class="article-content">
            <div id="article-tags" class="hashtags">
                <!-- Injected via JS -->
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <h2 class="logo">Vektora</h2>
            <p style="margin-top:0.5rem; font-size:0.9rem;">© 2026 Minimalist Media. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
